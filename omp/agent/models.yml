# Shared OMP model registry, synced across machines via bootstrap.sh
# (symlinked to ~/.omp/agent/models.yml). This file registers models the
# bundled catalog does not ship. Credentials are per-machine and live in the
# shell environment or ~/.omp/agent/.env — never here.
#
# 2026-08-20: dropped the custom DeepSeek R1 (nvidia/deepseek-ai/deepseek-r1)
# entry that used to back /diagram — NVIDIA removed that model from its
# catalog entirely (confirmed via GET /v1/models and a direct chat/completions
# 404 against both deepseek-ai/deepseek-r1 and the -0528 variant). /diagram
# now points at nvidia/nemotron-3-ultra-550b-a55b (config.yml modelRoles),
# which the bundled catalog already ships with reasoning: true, so no custom
# registration is needed here anymore.
#
# 2026-09-12: added a custom `qwen` provider to back /qwen (repo audits/code
# review, formerly /gemini) and, via bootstrap.sh step 8h, the Hindsight
# memory backend (formerly Gemini) — both moved off GEMINI_API_KEY onto
# QWEN_API_KEY. The bundled catalog only exposes Qwen models through
# amazon-bedrock (AWS credentials) or nvidia (NVIDIA_API_KEY), neither of
# which authenticates with this key directly, so a custom provider entry is
# required the same way the retired DeepSeek R1 entry above was. See
# AGENTS.md's routing rule 1 and "Memory (Hindsight)" section for the full
# rationale.
#
# IMPORTANT: this machine's QWEN_API_KEY is a QwenCloud "Token Plan" key
# (`sk-sp-...` prefix, monthly-subscription/credits billing), NOT a plain
# pay-as-you-go DashScope key (`sk-...`). The two are issued by different
# portals and are NOT interchangeable — each is bound to its own base URL
# (confirmed live 2026-09-12: `dashscope(-intl).aliyuncs.com/compatible-
# mode/v1` and `coding(-intl).dashscope.aliyuncs.com/v1` both 401 on this
# key; `token-plan.maas.qwencloudapi.com/compatible-mode/v1` is the one
# that actually authenticates). If this key is ever rotated for a plain
# pay-as-you-go key, baseUrl must change back to a dashscope.aliyuncs.com
# address — check the new key's prefix (`sk-sp-` vs `sk-`) first.
#
# NOTE: image generation (FLUX.1) is NOT configured here. models.yml only
# registers chat/completion models; FLUX.1 on NVIDIA Build is a REST image API
# (Visual GenAI NIM), so it ships as ~/.omp/agent/scripts/flux.py + /flux.

providers:
  qwen:
    baseUrl: https://token-plan.maas.qwencloudapi.com/compatible-mode/v1
    apiKey: QWEN_API_KEY
    api: openai-completions
    models:
      - id: qwen3.8-max
        name: Qwen3.8 Max
        reasoning: true
        input: [text]
        contextWindow: 1000000
        maxTokens: 131072
        cost:
          # Public pay-as-you-go rate; this account bills against Token Plan
          # subscription credits instead, so actual marginal $/request may
          # differ. Kept for OMP's relative cost/budget display, not invoicing.
          input: 2.00
          output: 6.00
          cacheRead: 0
          cacheWrite: 0
        compat:
          thinkingFormat: qwen
