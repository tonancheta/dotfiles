# Shared OMP model-role config, synced across machines via bootstrap.sh.
# Machine-specific settings (shellPath, theme, symbolPreset) stay in the
# machine-local ~/.omp/agent/config.yml and are NOT overwritten by this file
# — merge any new shared keys here by hand instead of symlinking this file
# wholesale over an existing config.yml.
modelRoles:
  nemotron: nvidia/nemotron-3-super-120b-a12b:high
  qwen: qwen/qwen3.8-max:high
  deepseek: deepseek/deepseek-v4-flash:low
  deepseek-r: deepseek/deepseek-v4-pro:max
  diagram: nvidia/nemotron-3-ultra-550b-a55b:high

# Memory: Hindsight-backed autonomous memory (see omp/agent/AGENTS.md's
# "Memory (Hindsight)" section for the full setup). bootstrap.sh starts a
# local `hindsight` Docker container (Qwen as its LLM backend, reusing
# QWEN_API_KEY — no new provider dependency) on every machine that has
# docker + QWEN_API_KEY; this block just points OMP at it. No apiToken:
# the local container has no auth configured.
memory:
  backend: hindsight
hindsight:
  apiUrl: http://localhost:8888
